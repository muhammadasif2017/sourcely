# Run the whole service with: docker compose up --build
# Database only (for local development and tests): docker compose up -d db
# Configuration comes from .env (copy .env.example first). Data lives in named volumes,
# so it survives container restarts and rebuilds.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      # 5434 on the host, because 5432 and 5433 are often taken by other local projects.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sourcely"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    image: sourcely:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://sourcely_owner:sourcely_owner@db:5432/sourcely
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: sourcely:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        # The API still starts without .env; only /ask and /ask/stream need an LLM key.
        required: false
    environment:
      # Inside the container these are fixed by Compose, whatever a local .env says.
      DATABASE_URL: postgresql+psycopg://sourcely_app:sourcely_app@db:5432/sourcely
      EMBEDDING_CACHE_DIR: /app/data/models
      # This stack serves plain HTTP on localhost, where Secure cookies aren't sent. Behind a
      # TLS proxy in any real deployment, set this to "true" (the application default).
      COOKIE_SECURE: "false"
    volumes:
      - model-cache:/app/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  model-cache:
